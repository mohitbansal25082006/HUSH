name: Bug in HUSH
description: Something in the extension itself (popup, dashboard, settings) does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What went wrong?
      description: Steps to reproduce, what you expected and what you saw.
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Errors
      description: Any errors shown on chrome://extensions for HUSH (click "Errors").
      render: text
  - type: input
    id: versions
    attributes:
      label: HUSH and browser versions
      placeholder: HUSH 1.0.0, Chrome 141
    validations:
      required: true
